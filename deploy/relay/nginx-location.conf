# Place these directives inside the HTTPS server block for your Relay domain.
location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Replace, rather than append to, a caller-supplied header. The Relay
    # trusts this proxy only when its exact source address is configured, and
    # then uses the right-most valid address for pairing rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
