services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DSH_RELAY_BOOTSTRAP_TOKEN: ${DSH_RELAY_BOOTSTRAP_TOKEN:?set DSH_RELAY_BOOTSTRAP_TOKEN}
      DSH_RELAY_REGISTRY_PATH: /data/registry.json
      DSH_RELAY_TRUSTED_PROXIES: ${DSH_RELAY_TRUSTED_PROXIES:-}
    volumes:
      - relay-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  relay-data:
