- insert:
    - id: dsh-anywhere-plugin
      name: './lib/index.js'
      inject:
        - webServer
        - sessionController
        - workspaceRegistry
        - typertGateway
        - directoryPicker
      config:
        routePrefix: /dsh-anywhere/v1
        approvalTimeoutMs: 120000
        eventBufferSize: 2000
